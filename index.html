<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PunchPulse</title>
  <meta name="description" content="A neon rhythm punch workout for Meta Quest." />
  <meta name="theme-color" content="#05060f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <style>
    html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; font-family: system-ui, sans-serif; }
    #overlay {
      position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: radial-gradient(ellipse at center, rgba(10,14,40,.94), rgba(5,6,15,.99)); color: #cfe3ff; text-align: center; padding: 16px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { margin: 0; font-size: clamp(36px, 8vw, 72px); letter-spacing: 6px; color: #fff; text-shadow: 0 0 24px #00e5ff; }
    #overlay p { margin: 0; opacity: .8; max-width: 480px; line-height: 1.4; }
    #overlay button {
      font: 700 18px system-ui, sans-serif; letter-spacing: 2px; padding: 14px 28px; border-radius: 12px; cursor: pointer;
      border: 2px solid #00e5ff; background: #00e5ff; color: #05060f; min-width: 260px;
    }
    #overlay button.secondary { background: transparent; color: #cfe3ff; border-color: #4a5880; }
    #overlay button:disabled { opacity: .5; cursor: default; }
    #overlay small { opacity: .55; }
  </style>
  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="overlay">
    <h1>PUNCHPULSE</h1>
    <p>Punch the <b style="color:#ff3b5c">red</b> targets with your left hand and the <b style="color:#4da3ff">blue</b> ones with your right — on the beat.</p>
    <button id="enter-vr" disabled>CHECKING VR…</button>
    <button id="desktop" class="secondary">DESKTOP PREVIEW (MOUSE)</button>
    <small>Clear your play space. Use the wrist straps.</small>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
